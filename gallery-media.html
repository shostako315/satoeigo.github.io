<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- このサイトは https://eigosato.com/ に移転しました（即時リダイレクト） -->
  <link rel="canonical" href="https://eigosato.com/">
  <meta http-equiv="refresh" content="0; url=https://eigosato.com/">
  <script>window.location.replace("https://eigosato.com/");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>佐藤瑛吾 | eigosato.com へ移転しました</title>
  <meta name="description" content="指揮者 佐藤瑛吾の公式サイトは https://eigosato.com/ に移転しました。">
  <meta property="og:title" content="佐藤瑛吾 | eigosato.com へ移転しました">
  <meta property="og:description" content="指揮者 佐藤瑛吾の公式サイトは https://eigosato.com/ に移転しました。">
  <meta property="og:url" content="https://eigosato.com/">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=3">
  <style>
    .media-gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .media-card {
      display: flex;
      flex-direction: column;
      transition: transform 0.15s;
    }
    .media-card:hover {
      transform: translateY(-2px);
    }
    .media-thumb {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      background: #e7e8ee;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 2px 18px rgba(0,0,0,0.06);
    }
    .media-thumb iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: none;
    }
    .media-card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
      box-shadow: 0 2px 18px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.3s;
    }
    .media-card img:hover {
      transform: scale(1.02);
    }
    .media-caption {
      font-size: 1rem;
      font-family: 'Montserrat', 'Noto Serif JP', serif;
      font-weight: 600;
      color: #333;
      margin: 0 0 4px;
      line-height: 1.4;
    }
    .media-desc {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 0;
    }
    @media (max-width: 1024px) {
      .media-gallery-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
    }
    @media (max-width: 600px) {
      .media-gallery-grid { grid-template-columns: 1fr; gap: 16px; }
    }
    .img-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.92);
      align-items: center;
      justify-content: center;
    }
    .img-modal.active { display: flex; }
    .img-modal-content {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 10px;
      box-shadow: 0 0 32px rgba(0,0,0,0.3);
    }
    .img-modal-close {
      position: absolute;
      top: 24px; right: 38px;
      color: #fff;
      font-size: 40px;
      cursor: pointer;
      z-index: 10000;
    }
    .img-modal-close:hover { color: #ccc; }
  </style>
</head>
<body><p>このサイトは <a href="https://eigosato.com/">https://eigosato.com/</a> に移転しました。</p></body>
</html>
